<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Attendance - Ultra Neon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #05050a; color: #fff; min-height: 100vh; padding: 25px; display: flex; flex-direction: column; align-items: center; }
    
    .main-box {
      background: #0d0f1d;
      border: 2px solid #00f3ff;
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 0 20px #00f3ff;
    }
    h2 { text-align: center; color: #00f3ff; text-shadow: 0 0 10px #00f3ff; margin-bottom: 20px; text-transform: uppercase; }
    
    .select-box {
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      padding: 12px;
      background: #14172b;
      border: 2px solid #ff007f;
      color: #fff;
      border-radius: 8px;
      outline: none;
      box-shadow: 0 0 10px #ff007f;
      font-size: 16px;
      min-width: 250px;
    }
    
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
    }
    .cal-btn {
      background: transparent;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 6px 15px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 5px #00ff66;
      font-weight: bold;
    }
    .month-title { font-size: 18px; color: #00ff66; text-shadow: 0 0 5px #00ff66; font-weight: bold; }
    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .day-name {
      text-align: center;
      color: #ff007f;
      font-weight: bold;
      padding: 5px;
      text-shadow: 0 0 5px #ff007f;
    }
    .day-cell {
      background: #14172b;
      border: 1px solid #1f2440;
      border-radius: 8px;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .day-cell:hover { border-color: #00f3ff; box-shadow: 0 0 8px #00f3ff; }
    
    /* Past Dates Disabled Styling */
    .day-cell.past-date {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #333;
    }
    .day-cell.past-date:hover {
      border-color: #ff0055;
      box-shadow: 0 0 5px #ff0055;
    }

    .day-number { font-size: 14px; font-weight: bold; color: #aaa; align-self: flex-start; }
    .status-tag { font-size: 11px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    .status-P { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; box-shadow: 0 0 5px #00ff66; }
    .status-A { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; box-shadow: 0 0 5px #ff0055; }
    
    .nav-links { margin-top: 25px; display: flex; gap: 15px; justify-content: center; }
    .btn-link {
      padding: 10px 20px;
      background: transparent;
      border: 2px solid #ff007f;
      color: #ff007f;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #ff007f;
      text-decoration: none;
    }
    .btn-link:hover { background: #ff007f; color: #fff; }
  </style>
</head>
<body>

  <div class="main-box">
    <h2>Calendar Attendance Register</h2>
    
    <div class="select-box">
      <label style="color:#00f3ff; font-weight:bold;">Select Student:</label>
      <select id="studentSelect">
        <option value="">-- Choose Student --</option>
      </select>
    </div>

    <div class="calendar-header">
      <button class="cal-btn" id="prevMonth">&lt; Prev</button>
      <div class="month-title" id="monthDisplay">Month Year</div>
      <button class="cal-btn" id="nextMonth">Next &gt;</button>
    </div>

    <div class="calendar-grid">
      <div class="day-name">Sun</div><div class="day-name">Mon</div><div class="day-name">Tue</div>
      <div class="day-name">Wed</div><div class="day-name">Thu</div><div class="day-name">Fri</div><div class="day-name">Sat</div>
    </div>

    <div class="calendar-grid" id="calendarDays"></div>

    <div class="nav-links">
      <a href="index.html" class="btn-link">+ Register Student</a>
      <a href="records.html" class="btn-link" style="border-color:#00ff66; color:#00ff66; box-shadow:0 0 10px #00ff66;">View Stored Records</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDng_-HwKeiwEnda2hvqQ8YX2I9uqrxcug",
      authDomain: "attendence-register-kaushalji.firebaseapp.com",
      projectId: "attendence-register-kaushalji",
      storageBucket: "attendence-register-kaushalji.firebasestorage.app",
      messagingSenderId: "753842196139",
      appId: "1:753842196139:web:262b7a7c115aad610f71ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentDate = new Date();
    let studentsData = {};

    // Load Students Dropdown
    onValue(ref(db, 'students'), (snapshot) => {
      const select = document.getElementById('studentSelect');
      select.innerHTML = '<option value="">-- Choose Student --</option>';
      studentsData = snapshot.val() || {};
      
      Object.keys(studentsData).forEach(roll => {
        const option = document.createElement('option');
        option.value = roll;
        option.textContent = `${studentsData[roll].name} (Roll: ${roll})`;
        select.appendChild(option);
      });
    });

    async function renderCalendar() {
      const grid = document.getElementById('calendarDays');
      grid.innerHTML = '';

      const selectedRoll = document.getElementById('studentSelect').value;
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('monthDisplay').innerText = `${currentDate.toLocaleString('default', { month: 'long' })} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      // Today's date without time for exact comparison
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Get attendance data for selected student
      let monthRecords = {};
      if (selectedRoll) {
        const snap = await get(ref(db, `student_attendance/${selectedRoll}`));
        if (snap.exists()) monthRecords = snap.val();
      }

      // Blank slots before 1st date
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        grid.appendChild(emptyCell);
      }

      // Render days
      for (let day = 1; day <= totalDays; day++) {
        const dayCell = document.createElement('div');
        
        const cellDate = new Date(year, month, day);
        cellDate.setHours(0, 0, 0, 0);

        const isPast = cellDate < today;

        dayCell.className = `day-cell ${isPast ? 'past-date' : ''}`;
        
        const formattedDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        let statusHTML = '';
        if (selectedRoll && monthRecords[formattedDate]) {
          const st = monthRecords[formattedDate].status;
          statusHTML = `<span class="status-tag status-${st[0]}">${st}</span>`;
        }

        dayCell.innerHTML = `
          <span class="day-number">${day}</span>
          ${statusHTML}
        `;

        dayCell.addEventListener('click', () => {
          if (!selectedRoll) {
            alert("Pehle kisi student ko select karein!");
            return;
          }

          if (isPast) {
            alert("Beeti hui tareekh (Past Date) par attendance mark nahi kar sakte!");
            return;
          }

          toggleAttendance(selectedRoll, formattedDate, monthRecords[formattedDate]?.status);
        });

        grid.appendChild(dayCell);
      }
    }

    function toggleAttendance(roll, dateStr, currentStatus) {
      let newStatus = 'Present';
      if (currentStatus === 'Present') newStatus = 'Absent';
      else if (currentStatus === 'Absent') newStatus = 'Present';

      const studentName = studentsData[roll].name;

      set(ref(db, `student_attendance/${roll}/${dateStr}`), { status: newStatus, name: studentName });
      set(ref(db, `attendance/${dateStr}/${roll}`), { status: newStatus, name: studentName })
        .then(() => renderCalendar());
    }

    document.getElementById('studentSelect').addEventListener('change', renderCalendar);
    document.getElementById('prevMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('nextMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });

    renderCalendar();
  </script>
</body>
</html>
