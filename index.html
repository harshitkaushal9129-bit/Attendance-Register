<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Ultra Neon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: #05050a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .neon-card {
      background: #0d0f1d;
      border: 2px solid #00f3ff;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff;
    }
    h2 {
      text-align: center;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; color: #ff007f; font-weight: bold; text-shadow: 0 0 5px #ff007f; }
    input, select {
      width: 100%;
      padding: 12px;
      background: #14172b;
      border: 1px solid #ff007f;
      border-radius: 8px;
      color: #fff;
      outline: none;
      box-shadow: 0 0 5px #ff007f;
      transition: 0.3s;
    }
    input:focus, select:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 12px #00f3ff;
    }
    select option {
      background: #0d0f1d;
      color: #fff;
    }
    .img-preview {
      width: 90px;
      height: 90px;
      border: 2px dashed #00f3ff;
      border-radius: 50%;
      margin: 10px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 8px #00f3ff;
    }
    .img-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 2px solid #00ff66;
      color: #00ff66;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-shadow: 0 0 5px #00ff66;
      box-shadow: 0 0 10px #00ff66;
      transition: 0.3s;
      margin-top: 10px;
    }
    .btn:hover { background: #00ff66; color: #000; box-shadow: 0 0 25px #00ff66; }
    .nav-btn { border-color: #ff007f; color: #ff007f; text-shadow: 0 0 5px #ff007f; box-shadow: 0 0 10px #ff007f; }
    .nav-btn:hover { background: #ff007f; color: #fff; box-shadow: 0 0 25px #ff007f; }
    #msg { text-align: center; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="neon-card">
    <h2>Student Registration</h2>
    <form id="regForm">
      
      <!-- Sanstha Select Box -->
      <div class="form-group">
        <label>Select Sanstha / Institute</label>
        <select id="sanstha" required>
          <option value="">-- Choose Sanstha --</option>
          <option value="Kaushal Technical Institute">Kaushal Technical Institute</option>
          <option value="Computer Skill Academy">Computer Skill Academy</option>
          <option value="Digital Youth Foundation">Digital Youth Foundation</option>
        </select>
      </div>

      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="e.g. 101" required>
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter Full Name" required>
      </div>

      <div class="form-group">
        <label>Course / Class</label>
        <input type="text" id="course" placeholder="e.g. O Level / Web Dev" required>
      </div>

      <!-- Optional Image Input -->
      <div class="form-group">
        <label>Student Photo (Optional)</label>
        <input type="file" id="photo" accept="image/*">
        <div class="img-preview">
          <span id="placeholderText" style="font-size: 11px; color: #888;">No Photo</span>
          <img id="previewImg" alt="Student Preview">
        </div>
      </div>

      <button type="submit" class="btn">Register Student</button>
      <button type="button" class="btn nav-btn" onclick="location.href='attendance.html'">Open Calendar Attendance</button>
    </form>
    <div id="msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDng_-HwKeiwEnda2hvqQ8YX2I9uqrxcug",
      authDomain: "attendence-register-kaushalji.firebaseapp.com",
      projectId: "attendence-register-kaushalji",
      storageBucket: "attendence-register-kaushalji.firebasestorage.app",
      messagingSenderId: "753842196139",
      appId: "1:753842196139:web:262b7a7c115aad610f71ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let imageBase64 = "";

    // Image Preview & Base64 Converter
    document.getElementById('photo').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          imageBase64 = evt.target.result;
          const previewImg = document.getElementById('previewImg');
          previewImg.src = imageBase64;
          previewImg.style.display = "block";
          document.getElementById('placeholderText').style.display = "none";
        };
        reader.readAsDataURL(file);
      } else {
        imageBase64 = "";
        document.getElementById('previewImg').style.display = "none";
        document.getElementById('placeholderText').style.display = "block";
      }
    });

    // Form Submit Handler
    document.getElementById('regForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const sanstha = document.getElementById('sanstha').value;
      const roll = document.getElementById('roll').value.trim();
      const name = document.getElementById('name').value.trim();
      const course = document.getElementById('course').value.trim();
      const msg = document.getElementById('msg');

      set(ref(db, 'students/' + roll), {
        sanstha: sanstha,
        roll: roll,
        name: name,
        course: course,
        photo: imageBase64 || null
      }).then(() => {
        msg.style.color = '#00ff66';
        msg.innerText = "Student Added Successfully!";
        document.getElementById('regForm').reset();
        document.getElementById('previewImg').style.display = "none";
        document.getElementById('placeholderText').style.display = "block";
        imageBase64 = "";
      }).catch((err) => {
        msg.style.color = '#ff0055';
        msg.innerText = "Error: " + err.message;
      });
    });
  </script>
</body>
</html>
