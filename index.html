<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Ultra Neon</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05050a">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #05050a; color: #fff; min-height: 100vh; padding: 25px; display: flex; flex-direction: column; align-items: center; }
    .main-box { background: #0d0f1d; border: 2px solid #00f3ff; border-radius: 16px; padding: 25px; width: 100%; max-width: 600px; box-shadow: 0 0 20px #00f3ff; }
    h2 { text-align: center; color: #00f3ff; text-shadow: 0 0 10px #00f3ff; margin-bottom: 20px; text-transform: uppercase; }
    .colorful-neon-box { position: relative; background: linear-gradient(135deg, #090a15 0%, #150a21 100%); border-radius: 16px; padding: 18px; margin-bottom: 22px; text-align: center; border: 2px solid transparent; animation: gamingNeonGlow 3s infinite linear alternate; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    @keyframes gamingNeonGlow { 0% { border-color: #00f3ff; box-shadow: 0 0 15px #00f3ff, inset 0 0 12px #00f3ff; } 25% { border-color: #ff007f; box-shadow: 0 0 15px #ff007f, inset 0 0 12px #ff007f; } 50% { border-color: #7f00ff; box-shadow: 0 0 15px #7f00ff, inset 0 0 12px #7f00ff; } 75% { border-color: #00ff66; box-shadow: 0 0 15px #00ff66, inset 0 0 12px #00ff66; } 100% { border-color: #ffaa00; box-shadow: 0 0 15px #ffaa00, inset 0 0 12px #ffaa00; } }
    .btn-google { background: #ffffff; color: #111; font-weight: 800; padding: 12px 26px; border-radius: 30px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: 0.5px; box-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 25px #00f3ff; transition: all 0.3s ease; text-transform: uppercase; }
    .btn-google:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 0 25px rgba(255, 255, 255, 1), 0 0 35px #ff007f; }
    .user-profile { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; }
    .user-avatar { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #00ff66; box-shadow: 0 0 10px #00ff66; object-fit: cover; }
    .user-info { text-align: left; flex-grow: 1; overflow: hidden; }
    .user-info strong { color: #00f3ff; font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 5px #00f3ff; }
    .user-info span { color: #ff007f; font-size: 12px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 5px #ff007f; }
    .btn-logout { background: transparent; border: 2px solid #ff0055; color: #ff0055; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
    .btn-logout:hover { background: #ff0055; color: #fff; box-shadow: 0 0 15px #ff0055; }
    #formContent { display: none; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; color: #00ff66; text-shadow: 0 0 5px #00ff66; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; background: #14172b; border: 2px solid #ff007f; color: #fff; border-radius: 8px; outline: none; box-shadow: 0 0 8px #ff007f; font-size: 14px; }
    input:focus, select:focus { border-color: #00f3ff; box-shadow: 0 0 12px #00f3ff; }
    .btn-submit { width: 100%; padding: 12px; background: transparent; border: 2px solid #00ff66; color: #00ff66; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px #00ff66; font-size: 16px; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
    .btn-submit:hover { background: #00ff66; color: #000; box-shadow: 0 0 20px #00ff66; }
    .nav-links { margin-top: 25px; display: flex; gap: 15px; justify-content: center; }
    .btn-link { padding: 10px 20px; background: transparent; border: 2px solid #ff007f; color: #ff007f; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px #ff007f; text-decoration: none; }
    .btn-link:hover { background: #ff007f; color: #fff; }
    #accessMessage { text-align: center; color: #ff0055; font-weight: bold; margin-top: 15px; text-shadow: 0 0 8px #ff0055; display: none; }
  </style>
</head>
<body>
  <div class="main-box">
    <div class="colorful-neon-box" id="authBox">
      <button class="btn-google" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.7l-2.9 2.25C2.45 15.82 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.87 10.82c-.18-.53-.28-1.1-.28-1.82s.1-1.29.28-1.82L.97 4.93C.35 6.16 0 7.55 0 9s.35 2.84.97 4.07l2.9-2.25z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.18.97 4.93l2.9 2.25c.72-2.13 2.75-3.6 5.13-3.6z"/></svg>
        Sign in with Google
      </button>
    </div>
    <div id="accessMessage">Access Denied: Your Gmail ID is not registered in the database!</div>
    <div id="formContent">
      <h2>Student Registration</h2>
      <form id="studentForm">
        <div class="form-group">
          <label for="roll">Roll Number *</label>
          <input type="text" id="roll" placeholder="Enter Roll Number" required>
        </div>
        <div class="form-group">
          <label for="name">Student Name *</label>
          <input type="text" id="name" placeholder="Enter Full Name" required>
        </div>
        <div class="form-group">
          <label for="course">Course Name *</label>
          <input type="text" id="course" placeholder="e.g. O Level, CCC, Web Dev" required>
        </div>
        <div class="form-group">
          <label for="sanstha">Sanstha / Center *</label>
          <input type="text" id="sanstha" placeholder="Enter Institute Name" required>
        </div>
        <div class="form-group">
          <label for="email">Student Gmail ID *</label>
          <input type="email" id="email" placeholder="student@gmail.com" required>
        </div>
        <div class="form-group">
          <label for="photo">Photo Image URL (Optional)</label>
          <input type="url" id="photo" placeholder="https://example.com/photo.jpg">
        </div>
        <button type="submit" class="btn-submit">Register Student</button>
      </form>
      <div class="nav-links">
        <a href="calendar.html" class="btn-link">Go To Calendar Attendance</a>
        <a href="records.html" class="btn-link" style="border-color:#00ff66; color:#00ff66; box-shadow:0 0 10px #00ff66;">View Records</a>
      </div>
    </div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error("SW Registration Error:", err));
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDng_-HwKeiwEnda2hvqQ8YX2I9uqrxcug",
      authDomain: "attendence-register-kaushalji.firebaseapp.com",
      projectId: "attendence-register-kaushalji",
      storageBucket: "attendence-register-kaushalji.firebasestorage.app",
      messagingSenderId: "753842196139",
      appId: "1:753842196139:web:262b7a7c115aad610f71ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence).catch(err => console.error("Persistence Error:", err));

    const authBox = document.getElementById('authBox');
    const formContent = document.getElementById('formContent');
    const accessMessage = document.getElementById('accessMessage');
    const studentForm = document.getElementById('studentForm');

    document.addEventListener('click', (e) => {
      if (e.target.closest('#googleLoginBtn')) {
        signInWithPopup(auth, provider).catch(err => alert("Google Auth Error: " + err.message));
      }
      if (e.target.closest('#logoutBtn')) {
        signOut(auth);
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userEmail = user.email.toLowerCase();
        const studentsSnap = await get(ref(db, 'students'));
        const allStudents = studentsSnap.val() || {};
        const isRegistered = Object.values(allStudents).some(
          student => student.email && student.email.toLowerCase() === userEmail
        );
        authBox.innerHTML = `
          <div class="user-profile">
            <img class="user-avatar" src="${user.photoURL || 'https://via.placeholder.com/40'}" alt="User">
            <div class="user-info">
              <strong>${user.displayName || 'User'}</strong>
              <span>${user.email}</span>
            </div>
            <button class="btn-logout" id="logoutBtn">Logout</button>
          </div>
        `;
        if (isRegistered) {
          accessMessage.style.display = 'none';
          formContent.style.display = 'block';
        } else {
          formContent.style.display = 'none';
          accessMessage.style.display = 'block';
        }
      } else {
        authBox.innerHTML = `
          <button class="btn-google" id="googleLoginBtn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.7l-2.9 2.25C2.45 15.82 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.87 10.82c-.18-.53-.28-1.1-.28-1.82s.1-1.29.28-1.82L.97 4.93C.35 6.16 0 7.55 0 9s.35 2.84.97 4.07l2.9-2.25z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.18.97 4.93l2.9 2.25c.72-2.13 2.75-3.6 5.13-3.6z"/></svg>
            Sign in with Google
          </button>
        `;
        formContent.style.display = 'none';
        accessMessage.style.display = 'none';
      }
    });

    studentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const roll = document.getElementById('roll').value.trim();
      const name = document.getElementById('name').value.trim();
      const course = document.getElementById('course').value.trim();
      const sanstha = document.getElementById('sanstha').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const photo = document.getElementById('photo').value.trim();

      if (!roll || !name || !course || !sanstha || !email) {
        alert("Kripya sabhi zaroori details bharein!");
        return;
      }

      try {
        await set(ref(db, `students/${roll}`), { roll, name, course, sanstha, email, photo });
        alert(`Student "${name}" successfully registered!`);
        studentForm.reset();
      } catch (err) {
        alert("Registration Error: " + err.message);
      }
    });
  </script>
</body>
</html>
