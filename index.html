<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Ultra Neon</title>
  <!-- Manifest File & Theme Color Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05050a">
  <!-- iOS App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <link rel="apple-touch-icon" href="https://harshitkaushal9129-bit.github.io/full-forms-for-o-level/kaushalji.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #05050a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; overflow-x: hidden; }
    .neon-card { background: #0d0f1d; border: 2px solid #00f3ff; border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff; position: relative; z-index: 1; }
    h2 { text-align: center; color: #00f3ff; text-shadow: 0 0 10px #00f3ff; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
    
    /* Top Highlighted Animated Neon Gmail Input Box */
    .gmail-input-card {
      background: #121528;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 22px;
      border: 2px solid transparent;
      animation: neonGlow 4s linear infinite alternate;
    }
    @keyframes neonGlow {
      0% { border-color: #00f3ff; box-shadow: 0 0 15px #00f3ff, inset 0 0 8px #00f3ff; }
      33% { border-color: #ff007f; box-shadow: 0 0 15px #ff007f, inset 0 0 8px #ff007f; }
      66% { border-color: #00ff66; box-shadow: 0 0 15px #00ff66, inset 0 0 8px #00ff66; }
      100% { border-color: #ff00ff; box-shadow: 0 0 15px #ff00ff, inset 0 0 8px #ff00ff; }
    }
    .gmail-label-tag { font-size: 11px; font-weight: 800; color: #00ff66; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 5px #00ff66; display: block; margin-bottom: 6px; }
    .gmail-input-wrapper { display: flex; align-items: center; background: #191c33; border: 1px solid #00f3ff; border-radius: 8px; padding: 6px 12px; gap: 10px; box-shadow: 0 0 8px rgba(0, 243, 255, 0.3); }
    .gmail-input-wrapper svg { width: 22px; height: 22px; flex-shrink: 0; }
    .gmail-input-wrapper input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; font-weight: 600; box-shadow: none; padding: 6px 0; }
    .gmail-input-wrapper input::placeholder { color: #7a82a6; font-weight: normal; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; color: #ff007f; font-weight: bold; text-shadow: 0 0 5px #ff007f; }
    input, select { width: 100%; padding: 12px; background: #14172b; border: 1px solid #ff007f; border-radius: 8px; color: #fff; outline: none; box-shadow: 0 0 5px #ff007f; transition: 0.3s; }
    input:focus, select:focus { border-color: #00f3ff; box-shadow: 0 0 12px #00f3ff; }
    select option { background: #0d0f1d; color: #fff; }
    
    .img-preview { width: 90px; height: 90px; border: 2px dashed #00f3ff; border-radius: 50%; margin: 10px auto 0; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 8px #00f3ff; }
    .img-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
    
    .btn { width: 100%; padding: 14px; background: transparent; border: 2px solid #00ff66; color: #00ff66; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-shadow: 0 0 5px #00ff66; box-shadow: 0 0 10px #00ff66; transition: 0.3s; margin-top: 10px; }
    .btn:hover { background: #00ff66; color: #000; box-shadow: 0 0 25px #00ff66; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .nav-btn { border-color: #ff007f; color: #ff007f; text-shadow: 0 0 5px #ff007f; box-shadow: 0 0 10px #ff007f; }
    .nav-btn:hover { background: #ff007f; color: #fff; box-shadow: 0 0 25px #ff007f; }
    
    /* Toggle Panel Button Style */
    .view-list-btn {
      width: 100%;
      background: rgba(0, 243, 255, 0.1);
      border: 1px dashed #00f3ff;
      color: #00f3ff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .view-list-btn:hover {
      background: #00f3ff;
      color: #000;
      box-shadow: 0 0 10px #00f3ff;
    }

    #msg { text-align: center; margin-top: 15px; font-weight: bold; }
    #newSansthaBox { background: #101426; padding: 12px; border: 1px dashed #00f3ff; border-radius: 8px; margin-top: 8px; display: none; }
    
    /* Live Student Search Preview Card */
    #studentPreviewCard { display: none; background: linear-gradient(135deg, #13172e, #1a1f3c); border: 1.5px solid #00f3ff; border-radius: 12px; padding: 12px; margin-top: 10px; box-shadow: 0 0 12px rgba(0, 243, 255, 0.4); animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .preview-header { font-size: 11px; font-weight: bold; color: #ffcc00; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; text-shadow: 0 0 5px #ffcc00; }
    .preview-body { display: flex; align-items: center; gap: 12px; }
    .preview-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #ff007f; object-fit: cover; box-shadow: 0 0 8px #ff007f; flex-shrink: 0; }
    .preview-details { font-size: 13px; line-height: 1.4; color: #e0e0e0; }
    .preview-details strong { color: #00ff66; font-size: 14px; }
    .preview-tag { display: inline-block; background: rgba(0, 243, 255, 0.15); color: #00f3ff; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-top: 4px; border: 1px solid #00f3ff; }

    /* Side Sliding Drawer Panel for Registered Students List */
    .side-panel {
      position: fixed;
      top: 0;
      right: -360px;
      width: 350px;
      height: 100vh;
      background: #0b0d1b;
      border-left: 2px solid #00f3ff;
      box-shadow: -5px 0 20px rgba(0, 243, 255, 0.4);
      z-index: 999;
      transition: right 0.4s ease-in-out;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .side-panel.open {
      right: 0;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ff007f;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }
    .panel-header h3 {
      color: #00f3ff;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 5px #00f3ff;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #ff007f;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 0 8px #ff007f;
    }
    .student-count-badge {
      background: #00ff66;
      color: #000;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      margin-left: 6px;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
    }
    /* Scrollbar styling */
    .panel-body::-webkit-scrollbar { width: 6px; }
    .panel-body::-webkit-scrollbar-track { background: #080a14; }
    .panel-body::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 4px; }
    
    .panel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #14172b;
      border: 1px solid rgba(255, 0, 127, 0.4);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    .panel-item:hover {
      border-color: #00f3ff;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }
    .panel-item img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 1.5px solid #00f3ff;
      object-fit: cover;
      flex-shrink: 0;
    }
    .panel-item-info {
      font-size: 12px;
      color: #ccc;
      line-height: 1.3;
    }
    .panel-item-info strong {
      color: #fff;
      font-size: 13px;
    }
    .panel-item-info span {
      color: #00ff66;
    }

    @media (max-width: 480px) {
      .side-panel {
        width: 100%;
        right: -100%;
      }
    }
  </style>
</head>
<body>

  <div class="neon-card">
    <form id="regForm" onkeydown="return event.key != 'Enter';">
      <!-- Top Highlighted Animated Neon Gmail Input Box -->
      <div class="gmail-input-card">
        <span class="gmail-label-tag">Gmail ID for Authentication</span>
        <div class="gmail-input-wrapper">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <input type="email" id="email" placeholder="example@gmail.com" required>
        </div>
      </div>

      <h2>Student Registration</h2>

      <div class="form-group">
        <label>Select Sanstha / Institute</label>
        <select id="sansthaSelect" required>
          <option value="">-- Choose Sanstha --</option>
          <option value="__ADD_NEW__">+ Add New Sanstha</option>
        </select>
        <div id="newSansthaBox">
          <input type="text" id="newSansthaName" placeholder="Enter New Sanstha Name" style="margin-bottom: 10px;">
          <input type="password" id="newSansthaPass" placeholder="Set Password for this Sanstha">
        </div>
      </div>
      
      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="e.g. 101" required>
      </div>
      
      <div class="form-group">
        <label>Full Name</label>
        <!-- Dynamic Dropdown List Attached -->
        <input type="text" id="name" list="studentNamesList" placeholder="Enter Full Name" autocomplete="off" required>
        <datalist id="studentNamesList"></datalist>
        
        <!-- Button to open slide side panel -->
        <button type="button" class="view-list-btn" id="openPanelBtn">📋 View Registered Students List</button>
        
        <!-- Colorful Live Preview Card Container -->
        <div id="studentPreviewCard"></div>
      </div>

      <div class="form-group">
        <label>Course / Class</label>
        <input type="text" id="course" placeholder="e.g. O Level / Web Dev" required>
      </div>

      <div class="form-group">
        <label>Student Photo (Optional)</label>
        <input type="file" id="photo" accept="image/*">
        <div class="img-preview">
          <span id="placeholderText" style="font-size: 11px; color: #888;">No Photo</span>
          <img id="previewImg" alt="Student Preview">
        </div>
      </div>

      <button type="button" id="submitBtn" class="btn">Register Student</button>
      <button type="button" class="btn nav-btn" onclick="location.href='attendance.html'">Open Calendar Attendance</button>
    </form>
    <div id="msg"></div>
  </div>

  <!-- Side Panel Container for Registered Students -->
  <div class="side-panel" id="sidePanel">
    <div class="panel-header">
      <h3>Registered Students <span class="student-count-badge" id="totalCount">0</span></h3>
      <button type="button" class="close-btn" id="closePanelBtn">&times;</button>
    </div>
    <div class="panel-body" id="panelStudentList">
      <!-- Dynamic Student Items Rendered Here -->
    </div>
  </div>

  <script type="module">
    // Register Service Worker for PWA / Offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered Successfully:', reg.scope))
          .catch(err => console.error('Service Worker Registration Failed:', err));
      });
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDng_-HwKeiwEnda2hvqQ8YX2I9uqrxcug",
      authDomain: "attendence-register-kaushalji.firebaseapp.com",
      projectId: "attendence-register-kaushalji",
      storageBucket: "attendence-register-kaushalji.firebasestorage.app",
      messagingSenderId: "753842196139",
      appId: "1:753842196139:web:262b7a7c115aad610f71ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let compressedBase64Image = "";
    let sansthaMap = {};
    let existingStudentNames = [];
    let studentsDataMap = {};

    const sansthaSelect = document.getElementById('sansthaSelect');
    const newSansthaBox = document.getElementById('newSansthaBox');
    const submitBtn = document.getElementById('submitBtn');
    const studentNamesList = document.getElementById('studentNamesList');
    const nameInput = document.getElementById('name');
    
    const sidePanel = document.getElementById('sidePanel');
    const openPanelBtn = document.getElementById('openPanelBtn');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const panelStudentList = document.getElementById('panelStudentList');
    const totalCount = document.getElementById('totalCount');

    // Toggle Side Drawer Panel
    openPanelBtn.addEventListener('click', () => sidePanel.classList.add('open'));
    closePanelBtn.addEventListener('click', () => sidePanel.classList.remove('open'));

    // Fetch Sansthas from Realtime Database
    onValue(ref(db, 'sansthas'), (snap) => {
      sansthaMap = snap.val() || {};
      sansthaSelect.innerHTML = '<option value="">-- Choose Sanstha --</option>';
      Object.keys(sansthaMap).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = key;
        sansthaSelect.appendChild(option);
      });
      const addNewOpt = document.createElement('option');
      addNewOpt.value = "__ADD_NEW__";
      addNewOpt.textContent = "+ Add New Sanstha";
      sansthaSelect.appendChild(addNewOpt);
    });

    // Populate Registered Students into Datalist, Map & Drawer List
    onValue(ref(db, 'students'), (snap) => {
      studentsDataMap = snap.val() || {};
      studentNamesList.innerHTML = '';
      panelStudentList.innerHTML = '';
      existingStudentNames = [];
      
      const studentArray = Object.values(studentsDataMap);
      totalCount.innerText = studentArray.length;

      if (studentArray.length === 0) {
        panelStudentList.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">Koi Students Registered Nahi Hain.</div>';
        return;
      }

      studentArray.forEach(student => {
        if (student.name) {
          existingStudentNames.push(student.name.toLowerCase());
          
          // Datalist Entry
          const option = document.createElement('option');
          option.value = student.name;
          option.label = `Roll: ${student.roll || 'N/A'}`;
          studentNamesList.appendChild(option);

          // Side Panel List Entry
          const photoUrl = student.photo || 'https://via.placeholder.com/150/14172b/00f3ff?text=No+Pic';
          const itemDiv = document.createElement('div');
          itemDiv.className = 'panel-item';
          itemDiv.innerHTML = `
            <img src="${photoUrl}" alt="${student.name}">
            <div class="panel-item-info">
              <strong>${student.name}</strong><br>
              Roll: <span>${student.roll || 'N/A'}</span> | ${student.course || 'N/A'}<br>
              <small style="color:#888;">Sanstha: ${student.sanstha || 'N/A'}</small>
            </div>
          `;
          panelStudentList.appendChild(itemDiv);
        }
      });
    });

    // Live Warning Alert & Student Preview Card on Name Search
    nameInput.addEventListener('input', () => {
      const typedName = nameInput.value.trim().toLowerCase();
      const previewCard = document.getElementById('studentPreviewCard');
      const msg = document.getElementById('msg');
      if (!typedName) {
        previewCard.style.display = "none";
        previewCard.innerHTML = "";
        if (msg.innerText.includes("Warning:")) msg.innerText = "";
        return;
      }
      const matchedStudent = Object.values(studentsDataMap).find(
        st => st.name && st.name.toLowerCase() === typedName
      );
      if (matchedStudent) {
        const photoUrl = matchedStudent.photo || 'https://via.placeholder.com/150/14172b/00f3ff?text=No+Pic';
        previewCard.innerHTML = `
          <div class="preview-header">⚠️ Already Registered Student Found!</div>
          <div class="preview-body">
            <img class="preview-avatar" src="${photoUrl}" alt="${matchedStudent.name}">
            <div class="preview-details">
              <strong>${matchedStudent.name}</strong><br>
              <span style="color: #ff007f;">Roll:</span> ${matchedStudent.roll || 'N/A'} | 
              <span style="color: #ff007f;">Course:</span> ${matchedStudent.course || 'N/A'}<br>
              <span style="color: #aaa;">Email:</span> ${matchedStudent.email || 'N/A'}<br>
              <span class="preview-tag">Sanstha: ${matchedStudent.sanstha || 'N/A'}</span>
            </div>
          </div>
        `;
        previewCard.style.display = "block";
        msg.style.color = '#ffcc00';
        msg.innerText = "Warning: Yeh Student Name pehle se list mein hai!";
      } else {
        previewCard.style.display = "none";
        previewCard.innerHTML = "";
        if (msg.innerText.includes("Warning:")) msg.innerText = "";
      }
    });

    sansthaSelect.addEventListener('change', () => {
      newSansthaBox.style.display = (sansthaSelect.value === "__ADD_NEW__") ? "block" : "none";
    });

    // Compress Image Before Storage
    document.getElementById('photo').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 300;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            compressedBase64Image = canvas.toDataURL('image/jpeg', 0.7);
            const previewImg = document.getElementById('previewImg');
            previewImg.src = compressedBase64Image;
            previewImg.style.display = "block";
            document.getElementById('placeholderText').style.display = "none";
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        compressedBase64Image = "";
        document.getElementById('previewImg').style.display = "none";
        document.getElementById('placeholderText').style.display = "block";
      }
    });

    // Form Submission Logic
    submitBtn.addEventListener('click', async () => {
      const msg = document.getElementById('msg');
      msg.innerText = "";
      let targetSanstha = sansthaSelect.value;
      const email = document.getElementById('email').value.trim().toLowerCase();
      const rawRoll = document.getElementById('roll').value.trim();
      const name = nameInput.value.trim();
      const course = document.getElementById('course').value.trim();

      if (!email || !rawRoll || !name || !course) {
        alert("Kripya saari required fields bharein!");
        return;
      }
      if (!targetSanstha) {
        alert("Kripya Sanstha select karein ya nayi add karein!");
        return;
      }

      // Sanitize Roll for Firebase Keys
      const safeRoll = rawRoll.replace(/[.#$\[\]]/g, "_");
      submitBtn.disabled = true;
      submitBtn.innerText = "Registering...";

      try {
        if (targetSanstha === "__ADD_NEW__") {
          const sName = document.getElementById('newSansthaName').value.trim().replace(/[.#$\[\]]/g, "_");
          const sPass = document.getElementById('newSansthaPass').value.trim();
          if (!sName || !sPass) {
            alert("Nayi Sanstha ka naam aur Password dono likhna zaroori hai!");
            submitBtn.disabled = false;
            submitBtn.innerText = "Register Student";
            return;
          }
          targetSanstha = sName;
          await set(ref(db, `sansthas/${sName}`), { password: sPass });
        }

        // Prevent Duplicate Overwriting Prompt
        const existingStudent = await get(ref(db, `students/${safeRoll}`));
        if (existingStudent.exists()) {
          const confirmOverwrite = confirm(`Roll Number "${rawRoll}" pehle se registered hai. Kya aap isko update karna chahte hain?`);
          if (!confirmOverwrite) {
            submitBtn.disabled = false;
            submitBtn.innerText = "Register Student";
            return;
          }
        }

        // Save Student Data into Firebase
        await set(ref(db, 'students/' + safeRoll), {
          email: email,
          sanstha: targetSanstha,
          roll: rawRoll,
          name: name,
          course: course,
          photo: compressedBase64Image || null,
          registeredAt: new Date().toISOString()
        });

        alert("Student Successfully Registered!");
        msg.style.color = '#00ff66';
        msg.innerText = "Student Registered Successfully!";

        // Reset Form
        document.getElementById('regForm').reset();
        document.getElementById('studentPreviewCard').style.display = "none";
        newSansthaBox.style.display = "none";
        document.getElementById('previewImg').style.display = "none";
        document.getElementById('placeholderText').style.display = "block";
        compressedBase64Image = "";

      } catch (err) {
        alert("Error: " + err.message);
        msg.style.color = '#ff0055';
        msg.innerText = "Error: " + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Register Student";
      }
    });
  </script>
</body>
</html>
