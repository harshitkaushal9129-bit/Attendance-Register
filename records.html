<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Records - Ultra Neon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #05050a; color: #fff; min-height: 100vh; padding: 25px; display: flex; flex-direction: column; align-items: center; }
    .main-box { background: #0d0f1d; border: 2px solid #00f3ff; border-radius: 16px; padding: 25px; width: 100%; max-width: 850px; box-shadow: 0 0 20px #00f3ff; }
    h2 { text-align: center; color: #00f3ff; text-shadow: 0 0 10px #00f3ff; margin-bottom: 20px; text-transform: uppercase; }
    .filter-container { display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    select, input[type="date"], input[type="text"] { padding: 10px 14px; background: #14172b; border: 2px solid #ff007f; color: #fff; border-radius: 8px; outline: none; box-shadow: 0 0 10px #ff007f; font-size: 14px; }
    select option { background: #0d0f1d; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #14172b; border-radius: 8px; overflow: hidden; box-shadow: 0 0 10px rgba(0,243,255,0.2); }
    th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #1f2440; }
    th { background: #1b1f3b; color: #00f3ff; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
    tr:hover { background: #1a1e38; }
    .student-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #00f3ff; background: #05050a; }
    .status-tag { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .status-Present { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; box-shadow: 0 0 5px #00ff66; }
    .status-Absent { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; box-shadow: 0 0 5px #ff0055; }
    .status-NotMarked { background: rgba(255, 255, 255, 0.1); color: #aaa; border: 1px solid #666; }
    .nav-links { margin-top: 25px; display: flex; gap: 15px; justify-content: center; }
    .btn-link { padding: 10px 20px; background: transparent; border: 2px solid #ff007f; color: #ff007f; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px #ff007f; text-decoration: none; }
    .btn-link:hover { background: #ff007f; color: #fff; }
    .no-data { text-align: center; padding: 20px; color: #888; font-style: italic; }
  </style>
</head>
<body>
  <div class="main-box">
    <h2>Stored Attendance Records</h2>
    <div class="filter-container">
      <div>
        <select id="sansthaFilter">
          <option value="">-- All Sanstha --</option>
        </select>
      </div>
      <div>
        <input type="date" id="datePicker">
      </div>
      <div>
        <input type="text" id="searchInput" placeholder="Search Roll / Name...">
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Photo</th>
          <th>Roll No</th>
          <th>Name</th>
          <th>Sanstha</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="recordsTable">
        <tr><td colspan="5" class="no-data">Select date to view records</td></tr>
      </tbody>
    </table>
    <div class="nav-links">
      <a href="index.html" class="btn-link">+ Register Student</a>
      <a href="attendance.html" class="btn-link" style="border-color:#00f3ff; color:#00f3ff; box-shadow:0 0 10px #00f3ff;">Calendar Attendance</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDng_-HwKeiwEnda2hvqQ8YX2I9uqrxcug",
      authDomain: "attendence-register-kaushalji.firebaseapp.com",
      projectId: "attendence-register-kaushalji",
      storageBucket: "attendence-register-kaushalji.firebasestorage.app",
      messagingSenderId: "753842196139",
      appId: "1:753842196139:web:262b7a7c115aad610f71ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const datePicker = document.getElementById('datePicker');
    const sansthaFilter = document.getElementById('sansthaFilter');
    const searchInput = document.getElementById('searchInput');
    const today = new Date().toISOString().split('T')[0];
    datePicker.value = today;

    let studentsData = {};
    let sansthaMap = {};
    let currentAuthorizedSanstha = "";

    onValue(ref(db, 'sansthas'), (snap) => {
      sansthaMap = snap.val() || {};
      sansthaFilter.innerHTML = '<option value="">-- All Sanstha --</option>';
      Object.keys(sansthaMap).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = key;
        sansthaFilter.appendChild(option);
      });
    });

    sansthaFilter.addEventListener('change', async () => {
      const selectedSanstha = sansthaFilter.value;
      if (selectedSanstha) {
        const passPrompt = prompt(`"${selectedSanstha}" ka Access Password darj karein:`);
        const sansthaSnap = await get(ref(db, `sansthas/${selectedSanstha}`));
        if (sansthaSnap.exists() && passPrompt === sansthaSnap.val().password) {
          alert("Password Verified! Access Granted.");
          currentAuthorizedSanstha = selectedSanstha;
          loadRecords();
        } else {
          alert("Galat Password! Access Denied.");
          sansthaFilter.value = currentAuthorizedSanstha;
          loadRecords();
        }
      } else {
        currentAuthorizedSanstha = "";
        loadRecords();
      }
    });

    async function loadRecords() {
      const selectedDate = datePicker.value;
      const selectedSanstha = sansthaFilter.value;
      const queryText = searchInput.value.toLowerCase().trim();
      const tableBody = document.getElementById('recordsTable');

      if (!selectedDate) {
        tableBody.innerHTML = '<tr><td colspan="5" class="no-data">Please pick a date</td></tr>';
        return;
      }

      const studentSnap = await get(ref(db, 'students'));
      studentsData = studentSnap.val() || {};

      const attendanceSnap = await get(ref(db, `attendance/${selectedDate}`));
      const attendanceData = attendanceSnap.val() || {};

      tableBody.innerHTML = '';
      let count = 0;

      Object.keys(studentsData).forEach(roll => {
        const student = studentsData[roll];
        const matchesSanstha = !selectedSanstha || student.sanstha === selectedSanstha;
        const matchesQuery = !queryText || roll.toLowerCase().includes(queryText) || student.name.toLowerCase().includes(queryText);

        if (matchesSanstha && matchesQuery) {
          const record = attendanceData[roll];
          const status = record ? record.status : 'NotMarked';
          const displayStatus = record ? record.status : 'Not Marked';
          const photo = student.photo || 'https://via.placeholder.com/40?text=User';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img src="${photo}" class="student-img" alt="Photo"></td>
            <td>${roll}</td>
            <td style="font-weight: bold; color: #fff;">${student.name}</td>
            <td style="color: #aaa; font-size: 13px;">${student.sanstha || 'N/A'}</td>
            <td><span class="status-tag status-${status}">${displayStatus}</span></td>
          `;
          tableBody.appendChild(tr);
          count++;
        }
      });

      if (count === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" class="no-data">No student records found for this selection</td></tr>';
      }
    }

    datePicker.addEventListener('change', loadRecords);
    searchInput.addEventListener('input', loadRecords);

    loadRecords();
  </script>
</body>
</html>
