<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Records - Ultra Neon Advanced</title>
  
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- jsPDF & AutoTable for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #05050a; color: #fff; min-height: 100vh; padding: 25px; display: flex; flex-direction: column; align-items: center; }
    .main-box { background: #0d0f1d; border: 2px solid #00f3ff; border-radius: 16px; padding: 25px; width: 100%; max-width: 950px; box-shadow: 0 0 20px #00f3ff; }
    h2 { text-align: center; color: #00f3ff; text-shadow: 0 0 10px #00f3ff; margin-bottom: 20px; text-transform: uppercase; }
    
    .filter-container { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    select, input[type="date"], input[type="text"] { padding: 10px 14px; background: #14172b; border: 2px solid #ff007f; color: #fff; border-radius: 8px; outline: none; box-shadow: 0 0 10px #ff007f; font-size: 14px; }
    select option { background: #0d0f1d; color: #fff; }

    .action-bar { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 15px; }
    .summary-pills { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .pill-total { background: rgba(0, 243, 255, 0.15); border: 1px solid #00f3ff; color: #00f3ff; }
    .pill-present { background: rgba(0, 255, 102, 0.15); border: 1px solid #00ff66; color: #00ff66; }
    .pill-absent { background: rgba(255, 0, 85, 0.15); border: 1px solid #ff0055; color: #ff0055; }
    .pill-leave { background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; }

    .btn-export-group { display: flex; gap: 8px; }
    .btn-export { padding: 8px 14px; background: transparent; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
    .btn-excel { border: 1px solid #00ff66; color: #00ff66; box-shadow: 0 0 5px #00ff66; }
    .btn-excel:hover { background: #00ff66; color: #000; }
    .btn-pdf { border: 1px solid #ff007f; color: #ff007f; box-shadow: 0 0 5px #ff007f; }
    .btn-pdf:hover { background: #ff007f; color: #fff; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 5px; background: #14172b; border-radius: 8px; overflow: hidden; box-shadow: 0 0 10px rgba(0,243,255,0.2); }
    th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #1f2440; vertical-align: middle; }
    th { background: #1b1f3b; color: #00f3ff; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
    tr:hover { background: #1a1e38; }
    .student-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #00f3ff; background: #05050a; }
    
    .status-tag { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
    .status-Present { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; box-shadow: 0 0 5px #00ff66; }
    .status-Absent { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; box-shadow: 0 0 5px #ff0055; }
    .status-Leave { background: rgba(255, 170, 0, 0.2); color: #ffaa00; border: 1px solid #ffaa00; box-shadow: 0 0 5px #ffaa00; }
    .status-NotMarked { background: rgba(255, 255, 255, 0.1); color: #aaa; border: 1px solid #666; }

    .btn-del { background: transparent; border: 1px solid #ff0055; color: #ff0055; padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13px; }
    .btn-del:hover { background: #ff0055; color: #fff; box-shadow: 0 0 8px #ff0055; }

    .nav-links { margin-top: 25px; display: flex; gap: 15px; justify-content: center; }
    .btn-link { padding: 10px 20px; background: transparent; border: 2px solid #ff007f; color: #ff007f; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px #ff007f; text-decoration: none; }
    .btn-link:hover { background: #ff007f; color: #fff; }
    .no-data { text-align: center; padding: 20px; color: #888; font-style: italic; }
  </style>
</head>
<body>
  <div class="main-box">
    <h2>Stored Attendance Records</h2>
    <div class="filter-container">
      <div>
        <select id="sansthaFilter">
          <option value="">-- Select Sanstha --</option>
        </select>
      </div>
      <div>
        <input type="date" id="datePicker">
      </div>
      <div>
        <input type="text" id="searchInput" placeholder="Search Roll / Name...">
      </div>
    </div>

    <div class="action-bar">
      <div class="summary-pills">
        <span class="pill pill-total" id="sumTotal">Total: 0</span>
        <span class="pill pill-present" id="sumPresent">Present: 0</span>
        <span class="pill pill-absent" id="sumAbsent">Absent: 0</span>
        <span class="pill pill-leave" id="sumLeave">Leave: 0</span>
      </div>
      <div class="btn-export-group">
        <button class="btn-export btn-excel" id="exportExcelBtn">📊 Export XLSX</button>
        <button class="btn-export btn-pdf" id="exportPdfBtn">📄 Download PDF</button>
      </div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Roll No</th>
            <th>Name</th>
            <th>Sanstha</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="recordsTable">
          <tr><td colspan="6" class="no-data">🔒 Please select Sanstha & enter password to unlock records</td></tr>
        </tbody>
      </table>
    </div>

    <div class="nav-links">
      <a href="index.html" class="btn-link">+ Register Student</a>
      <a href="attendance.html" class="btn-link" style="border-color:#00f3ff; color:#00f3ff; box-shadow:0 0 10px #00f3ff;">Calendar Attendance</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, onValue, get, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDng_-HwKeiwEnda2hvqQ8YX2I9uqrxcug",
      authDomain: "attendence-register-kaushalji.firebaseapp.com",
      projectId: "attendence-register-kaushalji",
      storageBucket: "attendence-register-kaushalji.firebasestorage.app",
      messagingSenderId: "753842196139",
      appId: "1:753842196139:web:262b7a7c115aad610f71ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const datePicker = document.getElementById('datePicker');
    const sansthaFilter = document.getElementById('sansthaFilter');
    const searchInput = document.getElementById('searchInput');
    const today = new Date().toISOString().split('T')[0];
    datePicker.value = today;

    let studentsData = {};
    let sansthaMap = {};
    let currentAuthorizedSanstha = "";
    let activeRenderedRecords = [];

    // Dynamic Sanstha Dropdown Loading
    onValue(ref(db, 'sansthas'), (snap) => {
      sansthaMap = snap.val() || {};
      sansthaFilter.innerHTML = '<option value="">-- Select Sanstha --</option>';
      Object.keys(sansthaMap).forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = key;
        sansthaFilter.appendChild(option);
      });
    });

    // Handle Sanstha Password Verification
    sansthaFilter.addEventListener('change', async () => {
      const selectedSanstha = sansthaFilter.value;
      if (selectedSanstha) {
        const passPrompt = prompt(`"${selectedSanstha}" ka Password darj karein:`);
        const sansthaSnap = await get(ref(db, `sansthas/${selectedSanstha}`));
        if (sansthaSnap.exists() && passPrompt === sansthaSnap.val().password) {
          alert("✅ Access Granted! Data Unlocked.");
          currentAuthorizedSanstha = selectedSanstha;
          loadRecords();
        } else {
          alert("❌ Galat Password! Access Denied.");
          sansthaFilter.value = "";
          currentAuthorizedSanstha = "";
          loadRecords();
        }
      } else {
        currentAuthorizedSanstha = "";
        loadRecords();
      }
    });

    async function loadRecords() {
      const selectedDate = datePicker.value;
      const queryText = searchInput.value.toLowerCase().trim();
      const tableBody = document.getElementById('recordsTable');

      if (!currentAuthorizedSanstha) {
        tableBody.innerHTML = '<tr><td colspan="6" class="no-data">🔒 Please select Sanstha & enter password to unlock records</td></tr>';
        resetCounters();
        return;
      }

      if (!selectedDate) {
        tableBody.innerHTML = '<tr><td colspan="6" class="no-data">Please pick a date</td></tr>';
        resetCounters();
        return;
      }

      const studentSnap = await get(ref(db, 'students'));
      studentsData = studentSnap.val() || {};

      const attendanceSnap = await get(ref(db, `attendance/${selectedDate}`));
      const attendanceData = attendanceSnap.val() || {};

      tableBody.innerHTML = '';
      activeRenderedRecords = [];

      let countTotal = 0, countPresent = 0, countAbsent = 0, countLeave = 0;

      Object.keys(studentsData).forEach(roll => {
        const student = studentsData[roll];
        
        if (student.sanstha === currentAuthorizedSanstha) {
          const matchesQuery = !queryText || roll.toLowerCase().includes(queryText) || student.name.toLowerCase().includes(queryText);

          if (matchesQuery) {
            const record = attendanceData[roll];
            const status = record ? record.status : 'NotMarked';
            const displayStatus = record ? record.status : 'Not Marked';
            const photo = student.photo || 'https://via.placeholder.com/40?text=User';

            if (status === 'Present') countPresent++;
            else if (status === 'Absent') countAbsent++;
            else if (status === 'Leave') countLeave++;
            countTotal++;

            activeRenderedRecords.push({
              roll: roll,
              name: student.name,
              sanstha: student.sanstha || 'N/A',
              status: displayStatus,
              date: selectedDate
            });

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><img src="${photo}" class="student-img" alt="Photo"></td>
              <td>${roll}</td>
              <td style="font-weight: bold; color: #fff;">${student.name}</td>
              <td style="color: #aaa; font-size: 13px;">${student.sanstha || 'N/A'}</td>
              <td><span class="status-tag status-${status}">${displayStatus}</span></td>
              <td><button class="btn-del" data-roll="${roll}" data-name="${student.name}">🗑️ Delete</button></td>
            `;
            tableBody.appendChild(tr);
          }
        }
      });

      document.getElementById('sumTotal').innerText = `Total: ${countTotal}`;
      document.getElementById('sumPresent').innerText = `Present: ${countPresent}`;
      document.getElementById('sumAbsent').innerText = `Absent: ${countAbsent}`;
      document.getElementById('sumLeave').innerText = `Leave: ${countLeave}`;

      if (countTotal === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" class="no-data">No records found for "${currentAuthorizedSanstha}" on selected date/search</td></tr>`;
      } else {
        // Attach delete action listener to dynamic buttons
        tableBody.querySelectorAll('.btn-del').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const roll = e.target.getAttribute('data-roll');
            const name = e.target.getAttribute('data-name');
            deleteStudent(roll, name);
          });
        });
      }
    }

    function resetCounters() {
      document.getElementById('sumTotal').innerText = `Total: 0`;
      document.getElementById('sumPresent').innerText = `Present: 0`;
      document.getElementById('sumAbsent').innerText = `Absent: 0`;
      document.getElementById('sumLeave').innerText = `Leave: 0`;
      activeRenderedRecords = [];
    }

    // Delete Student Functionality
    async function deleteStudent(roll, name) {
      const confirmPass = prompt(`🚨 Warning: Aap "${name}" (Roll: ${roll}) ko PERMANENTLY delete kar rahe hain.\n\nConfirm karne ke liye Sanstha Password darj karein:`);
      const sansthaSnap = await get(ref(db, `sansthas/${currentAuthorizedSanstha}`));
      
      if (sansthaSnap.exists() && confirmPass === sansthaSnap.val().password) {
        try {
          await remove(ref(db, `students/${roll}`));
          await remove(ref(db, `student_attendance/${roll}`));
          alert(`✅ Student "${name}" successfully deleted!`);
          loadRecords();
        } catch (err) {
          alert("Error deleting student: " + err.message);
        }
      } else {
        alert("❌ Galat Password! Student delete nahi hua.");
      }
    }

    // Excel Export Generator
    document.getElementById('exportExcelBtn').addEventListener('click', () => {
      if (activeRenderedRecords.length === 0) {
        alert("Export karne ke liye koi data available nahi hai!");
        return;
      }
      const dataToExport = activeRenderedRecords.map((item, index) => ({
        "S.No": index + 1,
        "Date": item.date,
        "Roll No": item.roll,
        "Student Name": item.name,
        "Sanstha": item.sanstha,
        "Status": item.status
      }));

      const worksheet = XLSX.utils.json_to_sheet(dataToExport);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Attendance Records");
      XLSX.writeFile(workbook, `Attendance_${currentAuthorizedSanstha}_${datePicker.value}.xlsx`);
    });

    // PDF Download Generator
    document.getElementById('exportPdfBtn').addEventListener('click', () => {
      if (activeRenderedRecords.length === 0) {
        alert("Export karne ke liye koi data available nahi hai!");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.setTextColor(0, 150, 200);
      doc.text(`Attendance Register: ${currentAuthorizedSanstha}`, 14, 15);
      
      doc.setFontSize(10);
      doc.setTextColor(100, 100, 100);
      doc.text(`Date: ${datePicker.value} | Total Records: ${activeRenderedRecords.length}`, 14, 22);

      const tableColumn = ["S.No", "Roll No", "Student Name", "Sanstha", "Status"];
      const tableRows = [];

      activeRenderedRecords.forEach((item, index) => {
        tableRows.push([
          index + 1,
          item.roll,
          item.name,
          item.sanstha,
          item.status
        ]);
      });

      doc.autoTable({
        head: [tableColumn],
        body: tableRows,
        startY: 28,
        theme: 'grid',
        headStyles: { fillColor: [27, 31, 59], textColor: [0, 243, 255] },
        styles: { fontSize: 10, cellPadding: 3 }
      });

      doc.save(`Attendance_${currentAuthorizedSanstha}_${datePicker.value}.pdf`);
    });

    datePicker.addEventListener('change', loadRecords);
    searchInput.addEventListener('input', loadRecords);
  </script>
</body>
</html>
