<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stored Records - Ultra Neon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #05050a; color: #fff; min-height: 100vh; padding: 30px; display: flex; flex-direction: column; align-items: center; }
    .neon-container { background: #0d0f1d; border: 2px solid #00ff66; border-radius: 16px; padding: 25px; width: 100%; max-width: 900px; box-shadow: 0 0 15px #00ff66; }
    h2 { text-align: center; color: #00ff66; text-shadow: 0 0 10px #00ff66; margin-bottom: 20px; text-transform: uppercase; }
    .filter-box { display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 20px; }
    input[type="date"] { padding: 10px; background: #14172b; border: 1px solid #00ff66; color: #fff; border-radius: 8px; outline: none; box-shadow: 0 0 5px #00ff66; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: center; border-bottom: 1px solid #1f2440; }
    th { color: #ff007f; text-shadow: 0 0 5px #ff007f; }
    .badge { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; }
    .badge-p { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; }
    .badge-a { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; }
    .nav-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; border: 2px solid #00f3ff; color: #00f3ff; text-decoration: none; font-weight: bold; border-radius: 8px; box-shadow: 0 0 10px #00f3ff; }
    .nav-btn:hover { background: #00f3ff; color: #000; }
  </style>
</head>
<body>

  <div class="neon-container">
    <h2>Date-wise Attendance Logs</h2>
    <div class="filter-box">
      <label>Select Date To Filter:</label>
      <input type="date" id="searchDate">
    </div>

    <table>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Student Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="recordsList">
        <tr><td colspan="3">Select a date to fetch records.</td></tr>
      </tbody>
    </table>

    <div style="text-align: center;">
      <a href="attendance.html" class="nav-btn">Back to Calendar Panel</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDng_-HwKeiwEnda2hvqQ8YX2I9uqrxcug",
      authDomain: "attendence-register-kaushalji.firebaseapp.com",
      projectId: "attendence-register-kaushalji",
      storageBucket: "attendence-register-kaushalji.firebasestorage.app",
      messagingSenderId: "753842196139",
      appId: "1:753842196139:web:262b7a7c115aad610f71ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const datePicker = document.getElementById('searchDate');
    datePicker.valueAsDate = new Date();

    function fetchRecords() {
      const dateVal = datePicker.value;
      const container = document.getElementById('recordsList');

      if (!dateVal) return;

      get(ref(db, `attendance/${dateVal}`)).then((snapshot) => {
        container.innerHTML = '';
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach((roll) => {
            const row = data[roll];
            const tr = document.createElement('tr');
            const isPresent = row.status === 'Present';
            tr.innerHTML = `
              <td>${roll}</td>
              <td>${row.name}</td>
              <td><span class="badge ${isPresent ? 'badge-p' : 'badge-a'}">${row.status}</span></td>
            `;
            container.appendChild(tr);
          });
        } else {
          container.innerHTML = `<tr><td colspan="3" style="color:#ff0055;">No records found for ${dateVal}</td></tr>`;
        }
      });
    }

    datePicker.addEventListener('change', fetchRecords);
    fetchRecords();
  </script>
</body>
</html>
